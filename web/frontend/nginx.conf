limit_req_zone $binary_remote_addr zone=login_per_ip:10m rate=${NGINX_LOGIN_RATE};

log_format gestionale '$remote_addr request_id=$request_id [$time_local] "$request" '
                      'status=$status bytes=$body_bytes_sent request_time=$request_time '
                      'limit_req=$limit_req_status';

access_log /dev/stdout gestionale;

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/security-headers.conf;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header Cross-Origin-Resource-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Permitted-Cross-Domain-Policies;
    proxy_hide_header X-XSS-Protection;

    location = /health {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/security-headers.conf;
        return 200 "ok\n";
    }

    location = /api/accounts/login {
        client_max_body_size 16k;
        limit_req zone=login_per_ip burst=${NGINX_LOGIN_BURST} nodelay;
        limit_req_status 429;
        limit_req_log_level warn;
        error_page 429 = @login_rate_limited;

        proxy_pass http://backend:8080/api/accounts/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        add_header X-Request-Id $request_id always;
        include /etc/nginx/security-headers.conf;
    }

    location @login_rate_limited {
        default_type application/json;
        add_header Retry-After "${NGINX_LOGIN_RETRY_AFTER_SECONDS}" always;
        add_header Cache-Control "no-store" always;
        add_header X-Request-Id $request_id always;
        include /etc/nginx/security-headers.conf;
        return 429 '{"timestamp":"$time_iso8601","status":429,"code":"RATE_LIMIT_EXCEEDED","message":"Troppi tentativi di accesso. Riprova piu tardi.","details":[],"path":"/api/accounts/login","requestId":"$request_id"}';
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        add_header X-Request-Id $request_id always;
        include /etc/nginx/security-headers.conf;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
        include /etc/nginx/security-headers.conf;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/security-headers.conf;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
