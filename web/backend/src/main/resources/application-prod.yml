spring:
  datasource:
    url: ${GESTIONALE_DB_URL}
    driver-class-name: org.postgresql.Driver
    username: ${GESTIONALE_DB_RUNTIME_USERNAME}
    password: ${GESTIONALE_DB_RUNTIME_PASSWORD}
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    url: ${GESTIONALE_DB_URL}
    user: ${GESTIONALE_DB_MIGRATOR_USERNAME}
    password: ${GESTIONALE_DB_MIGRATOR_PASSWORD}
    init-sqls: SET ROLE ${GESTIONALE_DB_OWNER_USERNAME}
    clean-disabled: true

gestionale:
  bootstrap:
    super-admin:
      enabled: ${GESTIONALE_BOOTSTRAP_SUPER_ADMIN_ENABLED:false}
      username: ${GESTIONALE_BOOTSTRAP_SUPER_ADMIN_USERNAME:}
      password: ${GESTIONALE_BOOTSTRAP_SUPER_ADMIN_PASSWORD:}

management:
  server:
    port: ${GESTIONALE_MANAGEMENT_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}
      environment: production
    distribution:
      percentiles-histogram:
        http.server.requests: true
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  structured:
    format:
      console: logstash
    json:
      add:
        service: ${spring.application.name}
        environment: production
