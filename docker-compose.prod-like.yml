x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${GESTIONALE_LOG_MAX_SIZE:-10m}
    max-file: ${GESTIONALE_LOG_MAX_FILES:-5}

services:
  postgres:
    build:
      context: .
      dockerfile: web/postgres/Dockerfile
    image: gestionale-postgres:prod-like
    container_name: ${GESTIONALE_POSTGRES_CONTAINER_NAME:-gestionale-prodlike-postgres}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gestionale}
      POSTGRES_USER: ${GESTIONALE_DB_USERNAME:?Set GESTIONALE_DB_USERNAME}
      POSTGRES_PASSWORD: ${GESTIONALE_DB_PASSWORD:-}
      POSTGRES_PASSWORD_FILE: ${GESTIONALE_DB_PASSWORD_FILE:-}
    ports:
      - "${GESTIONALE_POSTGRES_PORT:-5433}:5432"
    volumes:
      - gestionale-prodlike-postgres-data:/var/lib/postgresql/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=70,gid=70,mode=1770
      - /var/run/postgresql:rw,noexec,nosuid,nodev,size=16m,uid=70,gid=70,mode=0770
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: web/backend/Dockerfile
    image: gestionale-api:prod-like
    container_name: ${GESTIONALE_BACKEND_CONTAINER_NAME:-gestionale-prodlike-backend}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      GESTIONALE_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-gestionale}
      GESTIONALE_DB_USERNAME: ${GESTIONALE_DB_USERNAME:?Set GESTIONALE_DB_USERNAME}
      GESTIONALE_DB_PASSWORD: ${GESTIONALE_DB_PASSWORD:-}
      GESTIONALE_DB_PASSWORD_FILE: ${GESTIONALE_DB_PASSWORD_FILE:-}
      GESTIONALE_MANAGEMENT_PORT: ${GESTIONALE_MANAGEMENT_PORT:-9090}
      GESTIONALE_SECURITY_SESSION_DURATION_MINUTES: ${GESTIONALE_SECURITY_SESSION_DURATION_MINUTES:-45}
      GESTIONALE_SECURITY_SESSION_IDLE_TIMEOUT_MINUTES: ${GESTIONALE_SECURITY_SESSION_IDLE_TIMEOUT_MINUTES:-30}
      GESTIONALE_SECURITY_SESSION_TOUCH_INTERVAL_SECONDS: ${GESTIONALE_SECURITY_SESSION_TOUCH_INTERVAL_SECONDS:-60}
      GESTIONALE_BOOTSTRAP_SUPER_ADMIN_ENABLED: ${GESTIONALE_BOOTSTRAP_SUPER_ADMIN_ENABLED:-false}
      GESTIONALE_BOOTSTRAP_SUPER_ADMIN_USERNAME: ${GESTIONALE_BOOTSTRAP_SUPER_ADMIN_USERNAME:-}
      GESTIONALE_BOOTSTRAP_SUPER_ADMIN_PASSWORD: ${GESTIONALE_BOOTSTRAP_SUPER_ADMIN_PASSWORD:-}
      GESTIONALE_BOOTSTRAP_SUPER_ADMIN_PASSWORD_FILE: ${GESTIONALE_BOOTSTRAP_SUPER_ADMIN_PASSWORD_FILE:-}
    ports:
      - "127.0.0.1:${GESTIONALE_BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=1770
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${GESTIONALE_MANAGEMENT_PORT}/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  frontend:
    build:
      context: ./web/frontend
    image: gestionale-frontend:prod-like
    container_name: ${GESTIONALE_FRONTEND_CONTAINER_NAME:-gestionale-prodlike-frontend}
    environment:
      NGINX_ENVSUBST_FILTER: ^NGINX_
      NGINX_LOGIN_RATE: ${GESTIONALE_LOGIN_RATE_LIMIT:-10r/m}
      NGINX_LOGIN_BURST: ${GESTIONALE_LOGIN_RATE_BURST:-10}
      NGINX_LOGIN_RETRY_AFTER_SECONDS: ${GESTIONALE_LOGIN_RATE_RETRY_AFTER_SECONDS:-60}
    ports:
      - "${GESTIONALE_FRONTEND_PORT:-8081}:8080"
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=101,gid=101,mode=1770
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  prometheus:
    image: prom/prometheus:v3.13.1
    container_name: ${GESTIONALE_PROMETHEUS_CONTAINER_NAME:-gestionale-prodlike-prometheus}
    profiles:
      - observability
    user: "65534:65534"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${GESTIONALE_METRICS_RETENTION:-15d}
      - --web.listen-address=0.0.0.0:9090
    ports:
      - "127.0.0.1:${GESTIONALE_PROMETHEUS_PORT:-9091}:9090"
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - gestionale-prodlike-prometheus-data:/prometheus
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,uid=65534,gid=65534,mode=1770
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging

volumes:
  gestionale-prodlike-postgres-data:
  gestionale-prodlike-prometheus-data:
