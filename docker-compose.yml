services:
  postgres:
    image: postgres:16-alpine
    container_name: gestionale-postgres
    environment:
      POSTGRES_DB: gestionale
      POSTGRES_USER: gestionale
      POSTGRES_PASSWORD: gestionale_dev_password
    ports:
      - "5432:5432"
    volumes:
      - gestionale-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestionale -d gestionale"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  gestionale-postgres-data:
