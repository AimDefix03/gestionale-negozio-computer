services:
  postgres:
    build:
      context: .
      dockerfile: web/postgres/Dockerfile
    image: gestionale-postgres:local
    container_name: gestionale-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gestionale}
      POSTGRES_USER: ${GESTIONALE_DB_BOOTSTRAP_USERNAME:?Set GESTIONALE_DB_BOOTSTRAP_USERNAME}
      POSTGRES_PASSWORD: ${GESTIONALE_DB_BOOTSTRAP_PASSWORD:?Set GESTIONALE_DB_BOOTSTRAP_PASSWORD}
      GESTIONALE_DB_OWNER_USERNAME: ${GESTIONALE_DB_OWNER_USERNAME:?Set GESTIONALE_DB_OWNER_USERNAME}
      GESTIONALE_DB_MIGRATOR_USERNAME: ${GESTIONALE_DB_MIGRATOR_USERNAME:?Set GESTIONALE_DB_MIGRATOR_USERNAME}
      GESTIONALE_DB_MIGRATOR_PASSWORD: ${GESTIONALE_DB_MIGRATOR_PASSWORD:?Set GESTIONALE_DB_MIGRATOR_PASSWORD}
      GESTIONALE_DB_RUNTIME_USERNAME: ${GESTIONALE_DB_RUNTIME_USERNAME:?Set GESTIONALE_DB_RUNTIME_USERNAME}
      GESTIONALE_DB_RUNTIME_PASSWORD: ${GESTIONALE_DB_RUNTIME_PASSWORD:?Set GESTIONALE_DB_RUNTIME_PASSWORD}
      GESTIONALE_DB_BACKUP_USERNAME: ${GESTIONALE_DB_BACKUP_USERNAME:?Set GESTIONALE_DB_BACKUP_USERNAME}
      GESTIONALE_DB_BACKUP_PASSWORD: ${GESTIONALE_DB_BACKUP_PASSWORD:?Set GESTIONALE_DB_BACKUP_PASSWORD}
      GESTIONALE_DB_RESTORE_USERNAME: ${GESTIONALE_DB_RESTORE_USERNAME:?Set GESTIONALE_DB_RESTORE_USERNAME}
      GESTIONALE_DB_RESTORE_PASSWORD: ${GESTIONALE_DB_RESTORE_PASSWORD:?Set GESTIONALE_DB_RESTORE_PASSWORD}
    ports:
      - "127.0.0.1:${GESTIONALE_POSTGRES_PORT:-5432}:5432"
    volumes:
      - gestionale-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  gestionale-postgres-data:
