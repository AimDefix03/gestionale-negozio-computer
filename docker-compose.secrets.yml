services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ""
      POSTGRES_PASSWORD_FILE: /run/secrets/gestionale_db_bootstrap_password
      GESTIONALE_DB_MIGRATOR_PASSWORD: ""
      GESTIONALE_DB_MIGRATOR_PASSWORD_FILE: /run/secrets/gestionale_db_migrator_password
      GESTIONALE_DB_RUNTIME_PASSWORD: ""
      GESTIONALE_DB_RUNTIME_PASSWORD_FILE: /run/secrets/gestionale_db_runtime_password
      GESTIONALE_DB_BACKUP_PASSWORD: ""
      GESTIONALE_DB_BACKUP_PASSWORD_FILE: /run/secrets/gestionale_db_backup_password
      GESTIONALE_DB_RESTORE_PASSWORD: ""
      GESTIONALE_DB_RESTORE_PASSWORD_FILE: /run/secrets/gestionale_db_restore_password
    secrets:
      - gestionale_db_bootstrap_password
      - gestionale_db_migrator_password
      - gestionale_db_runtime_password
      - gestionale_db_backup_password
      - gestionale_db_restore_password

  backend:
    environment:
      GESTIONALE_DB_RUNTIME_PASSWORD: ""
      GESTIONALE_DB_RUNTIME_PASSWORD_FILE: /run/secrets/gestionale_db_runtime_password
      GESTIONALE_DB_MIGRATOR_PASSWORD: ""
      GESTIONALE_DB_MIGRATOR_PASSWORD_FILE: /run/secrets/gestionale_db_migrator_password
    secrets:
      - gestionale_db_runtime_password
      - gestionale_db_migrator_password

secrets:
  gestionale_db_bootstrap_password:
    file: ${GESTIONALE_DB_BOOTSTRAP_PASSWORD_SECRET_FILE:?Set GESTIONALE_DB_BOOTSTRAP_PASSWORD_SECRET_FILE}
  gestionale_db_migrator_password:
    file: ${GESTIONALE_DB_MIGRATOR_PASSWORD_SECRET_FILE:?Set GESTIONALE_DB_MIGRATOR_PASSWORD_SECRET_FILE}
  gestionale_db_runtime_password:
    file: ${GESTIONALE_DB_RUNTIME_PASSWORD_SECRET_FILE:?Set GESTIONALE_DB_RUNTIME_PASSWORD_SECRET_FILE}
  gestionale_db_backup_password:
    file: ${GESTIONALE_DB_BACKUP_PASSWORD_SECRET_FILE:?Set GESTIONALE_DB_BACKUP_PASSWORD_SECRET_FILE}
  gestionale_db_restore_password:
    file: ${GESTIONALE_DB_RESTORE_PASSWORD_SECRET_FILE:?Set GESTIONALE_DB_RESTORE_PASSWORD_SECRET_FILE}
