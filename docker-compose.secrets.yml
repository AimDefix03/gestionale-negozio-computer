services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ""
      POSTGRES_PASSWORD_FILE: /run/secrets/gestionale_db_password
    secrets:
      - gestionale_db_password

  backend:
    environment:
      GESTIONALE_DB_PASSWORD: ""
      GESTIONALE_DB_PASSWORD_FILE: /run/secrets/gestionale_db_password
    secrets:
      - gestionale_db_password

secrets:
  gestionale_db_password:
    file: ${GESTIONALE_DB_PASSWORD_SECRET_FILE:?Set GESTIONALE_DB_PASSWORD_SECRET_FILE}
