name: Gestionale Security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gestionale-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scanning:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan Git history and working tree
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  frontend-audit:
    name: Frontend npm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm run audit

  backend-dependency-inventory:
    name: Backend dependency inventory
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Resolve dependency tree
        run: mvn -B -DskipTests dependency:tree

      - name: Package backend for startup checks
        run: mvn -B -DskipTests package

      - name: Verify fail-closed startup
        run: ../../scripts/security/verify-backend-fail-closed.sh target/gestionale-api-0.1.0.jar

      - name: Scan backend dependencies
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --connect-timeout 10 --max-time 60 \
            https://dependency-check.github.io/DependencyCheck_Builder/nvd_cache/cache.properties \
            -o target/nvd-cache.properties 2>&1 | tee target/dependency-check.log
          java ../../scripts/security/NvdFeedFreshnessCheck.java target/nvd-cache.properties \
            2>&1 | tee -a target/dependency-check.log
          mvn -B dependency-check:check \
            '-DnvdDatafeedUrl=https://dependency-check.github.io/DependencyCheck_Builder/nvd_cache/nvdcve-{0}.json.gz' \
            -DnvdValidForHours=0 \
            -DdataDirectory="${{ runner.temp }}/dependency-check-data" \
            2>&1 | tee -a target/dependency-check.log

      - name: Upload dependency scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-dependency-check-${{ github.sha }}
          path: |
            web/backend/target/dependency-check-report.html
            web/backend/target/dependency-check-report.json
            web/backend/target/dependency-check.log
            web/backend/target/nvd-cache.properties
          if-no-files-found: warn
          retention-days: 14

  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - java-kotlin
          - javascript-typescript
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Setup Java
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build backend for CodeQL
        if: matrix.language == 'java-kotlin'
        working-directory: web/backend
        run: mvn -B -DskipTests package

      - name: Setup Node
        if: matrix.language == 'javascript-typescript'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install frontend dependencies
        if: matrix.language == 'javascript-typescript'
        working-directory: web/frontend
        run: npm ci

      - name: Build frontend for CodeQL
        if: matrix.language == 'javascript-typescript'
        working-directory: web/frontend
        run: npm run build

      - name: Analyze
        uses: github/codeql-action/analyze@v3
