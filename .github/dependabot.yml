version: 2
updates:
  - package-ecosystem: maven
    directory: /web/backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - backend
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: npm
    directory: /web/frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:20"
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend
    groups:
      frontend-runtime:
        patterns:
          - react
          - react-dom
      frontend-tooling:
        dependency-type: development
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:40"
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: ci
      include: scope
