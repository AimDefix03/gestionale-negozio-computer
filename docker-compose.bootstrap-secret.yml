services:
  backend:
    environment:
      GESTIONALE_BOOTSTRAP_SUPER_ADMIN_PASSWORD: ""
      GESTIONALE_BOOTSTRAP_SUPER_ADMIN_PASSWORD_FILE: /run/secrets/gestionale_bootstrap_password
    secrets:
      - gestionale_bootstrap_password

secrets:
  gestionale_bootstrap_password:
    file: ${GESTIONALE_BOOTSTRAP_SUPER_ADMIN_PASSWORD_SECRET_FILE:?Set GESTIONALE_BOOTSTRAP_SUPER_ADMIN_PASSWORD_SECRET_FILE}
